# =============================================================================
# Daily jobs: invoice reminders, overdue flags and privacy clean-up.
# =============================================================================
# Calls the "daily-jobs" Edge Function once a day. The function checks the
# CRON_SECRET header, so nobody else can trigger it.
#
# Secrets used: VITE_SUPABASE_URL, CRON_SECRET (same value as the CRON_SECRET
# secret you set in Supabase -> Edge Functions -> Secrets).
# =============================================================================
name: Daily jobs

on:
  schedule:
    - cron: '0 15 * * *'    # every day at 15:00 UTC (9 am Edmonton in summer, 8 am in winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily jobs
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set yet - skipping."; exit 0; fi
          curl -sS --fail-with-body -X POST "$URL/functions/v1/daily-jobs" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{}'
