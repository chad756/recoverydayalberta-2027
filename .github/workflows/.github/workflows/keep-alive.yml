# =============================================================================
# Keep the free Supabase project awake.
# =============================================================================
# Supabase pauses free projects after 7 days without activity. This makes one
# tiny read every day so that never happens. Nothing is changed.
#
# Secrets used: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (the same ones the
# website uses - the anon key is public by design).
# =============================================================================
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 13 * * *'   # every day at 13:17 UTC (7:17 am Edmonton in summer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public setting
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets not set yet - skipping."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/cities?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
