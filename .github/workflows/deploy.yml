# =============================================================================
# Build the site and publish it to GitHub Pages.
# =============================================================================
# Runs on every push to the main branch. You can also run it by hand:
# Actions tab -> "Deploy site to GitHub Pages" -> Run workflow.
#
# Secrets used (Settings -> Secrets and variables -> Actions -> Secrets):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Optional variable (Settings -> Secrets and variables -> Actions -> Variables):
#   BASE_PATH  - leave unset now (uses /<repo-name>/). Set to / at go-live.
# =============================================================================

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install packages
        # Uses package-lock.json if it's in the repo, otherwise creates one.
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build the site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Scan for secret keys (stops the deploy if any are found)
        run: npm run check:secrets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
