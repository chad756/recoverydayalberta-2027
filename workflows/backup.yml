# =============================================================================
# Weekly database backup.
# =============================================================================
# The free Supabase plan has no automatic backups you can download, so this
# makes one every Sunday. The backup is saved as a private "artifact" on this
# workflow run for 30 days (Actions -> Weekly backup -> pick a run -> Artifacts).
#
# The backup is ENCRYPTED with BACKUP_PASSPHRASE because this repo is public
# (artifacts of public repos can be downloaded by anyone who is logged in to
# GitHub). Keep the passphrase in Last Door's password manager.
#
# Secrets used:
#   SUPABASE_DB_URL     Supabase -> Connect -> "Session pooler" connection string
#                       (starts with postgresql:// and includes your database password)
#   BACKUP_PASSPHRASE   a long random password you make up
#
# To restore: see docs/SETUP-SUPABASE.md, "Restoring a backup".
# =============================================================================
name: Weekly backup

on:
  schedule:
    - cron: '0 9 * * 0'     # Sundays 09:00 UTC (3 am Edmonton)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y wget ca-certificates
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "::error::Set SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets first."; exit 1; fi
          stamp=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --schema=auth --schema=storage -Fc -f db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "rda-backup-$stamp.dump.gpg" db.dump
          rm db.dump
          ls -lh rda-backup-*.gpg

      - name: Save the encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: rda-backup
          path: rda-backup-*.dump.gpg
          retention-days: 30
